[package]
name = "zark-signer"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
zark-protocol = { path = "../protocol" }
anyhow = "1"
k256 = { version = "0.13", features = ["arithmetic", "schnorr"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
libc = "0.2"
sha2 = "0.10"

[dev-dependencies]
rcgen = "0.14"

[[bin]]
name = "zark-signer"
path = "src/main.rs"
