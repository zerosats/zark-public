[package]
name = "zark-protocol"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
bech32 = "0.11.1"
k256 = { version = "0.13", features = ["arithmetic", "schnorr"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
zeroize = "1"

[dev-dependencies]
rcgen = "0.14"
