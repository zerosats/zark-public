[package]
name = "zark-desktop"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

# Standalone workspace: the webview toolkit and its large dependency tree stay
# out of the wallet workspace, its lockfile and `cargo test --workspace`.
[workspace]

[[bin]]
name = "zark-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[profile.release]
strip = true
