# Included in nginx's http context. OPTIONS is answered in the rewrite phase,
# before connection admission or any bridge work. Keep this policy in sync with
# BrowserPolicy and Handler.do_OPTIONS.
limit_conn_zone $server_name zone=zark_bridge_total:1m;
map $http_origin $zark_cors_origin {
    default "";
    "https://zark.lx.dev" "https://zark.lx.dev";
}
map $http_access_control_request_headers $zark_preflight_headers {
    default 0;
    "" 1;
    ~*^\s*(content-type|x-zark-browser-demo)(\s*,\s*(content-type|x-zark-browser-demo))*\s*$ 1;
}
map "$request_method:$uri:$http_access_control_request_method:$zark_preflight_headers:$zark_cors_origin" $zark_preflight {
    default 0;
    ~^OPTIONS:/api/preview/(status|signer|mail|chain|faucet):POST:1:https://zark\.lx\.dev$ 1;
    ~^OPTIONS:/preview-assets/suite/[a-z0-9_./-]+:GET:1:https://zark\.lx\.dev$ 1;
}
# Separate SNI host; preserve the existing default chain.internal server.
server {
    listen 443 ssl;
    server_name zark-signer.lx.dev;
    ssl_certificate /etc/zark-wallet-bridge/tls/fullchain.pem;
    ssl_certificate_key /etc/zark-wallet-bridge/tls/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/zark-wallet-bridge-error.log crit;
    client_max_body_size 3000000;
    client_body_timeout 8s;
    client_header_timeout 8s;
    send_timeout 30s;

    limit_conn zark_bridge_total 32;
    limit_conn_status 429;
    limit_req_status 429;

    error_page 429 = @bridge_busy;
    location @bridge_busy {
        default_type application/json;
        add_header Access-Control-Allow-Origin $zark_cors_origin always;
        add_header Access-Control-Expose-Headers "Retry-After" always;
        add_header Retry-After "2" always;
        add_header Vary "Origin" always;
        add_header Cache-Control "no-store" always;
        return 429 '{"code":"overloaded","retryable":true,"error":"Server busy. Retry the same saved request shortly."}';
    }

    # Proxy errors must also be readable by the configured browser origin.
    error_page 400 404 405 408 413 500 502 503 504 = @bridge_error;
    location @bridge_error {
        default_type application/json;
        add_header Access-Control-Allow-Origin $zark_cors_origin always;
        add_header Vary "Origin" always;
        add_header Cache-Control "no-store" always;
        return 503 '{"code":"bridge_proxy_unavailable","error":"Bridge unavailable. Preserve the wallet and resume the saved operation."}';
    }

    location ~ ^/(api/preview/(status|signer|mail|chain|faucet)|preview-assets/suite/.+)$ {
        if ($zark_preflight = 1) {
            add_header Access-Control-Allow-Origin $zark_cors_origin always;
            add_header Access-Control-Allow-Methods "POST, GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, X-Zark-Browser-Demo" always;
            add_header Access-Control-Max-Age "600" always;
            add_header Vary "Origin" always;
            return 204;
        }
        if ($request_method = OPTIONS) { return 403; }
        proxy_pass https://127.0.0.1:7450;
        proxy_http_version 1.1;
        proxy_set_header Host zark-signer.lx.dev;
        proxy_set_header Origin $http_origin;
        proxy_set_header Connection close;
        proxy_set_header X-Zark-Browser-Demo $http_x_zark_browser_demo;
        # Overwrite, never append or trust a client-supplied forwarding chain.
        proxy_set_header X-Zark-Client-IP $remote_addr;
        proxy_set_header X-Zark-Client "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_ssl_server_name on;
        proxy_ssl_name zark-signer.lx.dev;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 4;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 5s;
        proxy_read_timeout 185s;
        proxy_send_timeout 10s;
        proxy_next_upstream off;
        proxy_cache off;
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_intercept_errors off;
    }
    location / { return 404; }
}
