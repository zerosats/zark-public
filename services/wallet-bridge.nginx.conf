# Separate SNI host; preserve the existing default chain.internal server.
server {
    listen 443 ssl;
    server_name zark-signer.lx.dev;
    ssl_certificate /etc/zark-wallet-bridge/tls/fullchain.pem;
    ssl_certificate_key /etc/zark-wallet-bridge/tls/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/zark-wallet-bridge-error.log crit;
    client_max_body_size 3000000;
    client_body_timeout 8s;
    client_header_timeout 8s;
    send_timeout 30s;

    # Proxy errors must also be readable by the configured browser origin.
    error_page 400 404 405 408 413 429 500 502 503 504 = @bridge_error;
    location @bridge_error {
        default_type application/json;
        add_header Access-Control-Allow-Origin "https://zark.lx.dev" always;
        add_header Vary "Origin" always;
        add_header Cache-Control "no-store" always;
        return 503 '{"code":"bridge_proxy_unavailable","error":"Bridge unavailable. Preserve the wallet and resume the saved operation."}';
    }

    location ~ ^/(api/preview/(status|signer|mail|chain)|preview-assets/suite/.+)$ {
        proxy_pass https://127.0.0.1:7450;
        proxy_http_version 1.1;
        proxy_set_header Host zark-signer.lx.dev;
        proxy_set_header Origin $http_origin;
        proxy_set_header Connection close;
        proxy_set_header X-Zark-Browser-Demo $http_x_zark_browser_demo;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_ssl_server_name on;
        proxy_ssl_name zark-signer.lx.dev;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 4;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 5s;
        proxy_read_timeout 185s;
        proxy_send_timeout 10s;
        proxy_next_upstream off;
        proxy_cache off;
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_intercept_errors off;
    }
    location / { return 404; }
}
